# Redis connection
REDIS_HOST=localhost
REDIS_PORT=6379
REDIS_PASSWORD=adfas

# SSL
REDIS_USE_SSL=false

# Connection timeout
REDIS_CONNECTION_TIMEOUT=10000

# Pool configuration
REDIS_MAX_TOTAL=20
REDIS_MAX_IDLE=10
REDIS_MIN_IDLE=2

# Pool validation
REDIS_TEST_ON_BORROW=true
REDIS_TEST_ON_RETURN=true
REDIS_TEST_WHILE_IDLE=true
REDIS_NUM_TESTS_PER_EVICTION_RUN=3

# Block when pool is exhausted
REDIS_BLOCK_WHEN_EXHAUSTED=true